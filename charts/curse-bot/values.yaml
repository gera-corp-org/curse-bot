# Default values for the curse-bot chart.

image:
  repository: ghcr.io/gera-corp-org/curse-bot
  # Empty means the chart's appVersion (for a published chart it equals the chart version).
  tag: ""
  # When set (sha256:...), the image is pulled by digest and tag is ignored.
  digest: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

nameOverride: ""
fullnameOverride: ""

# Always a single replica: two instances would post every addon twice, and SQLite is
# not built for several writers, so replicaCount is deliberately not configurable.

serviceAccount:
  create: true
  name: ""
  annotations: {}

podAnnotations: {}
podLabels: {}

# --- security (passes the Pod Security "restricted" profile) ---
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 65532
  runAsGroup: 65532
  fsGroup: 65532
  fsGroupChangePolicy: OnRootMismatch
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  privileged: false
  readOnlyRootFilesystem: true
  runAsNonRoot: true
  capabilities:
    drop: ["ALL"]

# --- bot settings ---
config:
  # Which WoW versions to announce: retail, classic, forever, comma-separated; empty means all.
  flavors: ""
  # Seconds between CurseForge checks.
  pollInterval: 600
  # Telegram user ids the bot answers commands from (/status, /latest, /pending, /flavors)
  # in private messages. Empty disables commands. The bot logs your id after your first
  # message to it: "message from a user who is not allowed, id=…".
  adminIds: []

# --- heartbeat liveness ---
# The bot touches /tmp/heartbeat after every polling cycle. If the file is older than
# maxAgeSeconds (empty means 2 × pollInterval + 300), the loop is considered stuck and
# the kubelet restarts the container.
liveness:
  enabled: true
  maxAgeSeconds: ""
  periodSeconds: 60
  failureThreshold: 3

# --- network ---
# All ingress is denied (the bot listens on no port). Egress is limited to DNS and
# TCP 443: CurseForge, Telegram and Vault (vault-env reaches it from the same container).
networkPolicy:
  enabled: true
  dns:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: kube-system
    podSelector:
      matchLabels:
        k8s-app: kube-dns
  # Outbound ports, to any address.
  egressPorts:
    - port: 443
      protocol: TCP
  # Extra egress rules in NetworkPolicy format (for example, Vault on 8200).
  extraEgress: []

# Extra environment variables (a list in Kubernetes format).
extraEnv: []

# --- secrets ---
# CURSEFORGE_API_KEY, TELEGRAM_BOT_TOKEN and TELEGRAM_CHAT_ID are required. Two ways:
#
# 1) Vault through the bank-vaults vault-secrets-webhook: the values are injected straight
#    into the process environment and never land in a Kubernetes Secret.
vault:
  enabled: true
  # Path to the secret in KV v2 (with /data/ in the path).
  secretPath: secret/data/curse-bot
  # Environment variable -> key inside the secret. Every key must exist in Vault,
  # otherwise the pod does not start.
  env:
    CURSEFORGE_API_KEY: CURSEFORGE_API_KEY
    TELEGRAM_BOT_TOKEN: TELEGRAM_BOT_TOKEN
    TELEGRAM_CHAT_ID: TELEGRAM_CHAT_ID
  # Empty values fall back to the webhook's own defaults.
  addr: ""
  role: ""
  # Path of the kubernetes auth method in Vault.
  authPath: ""
  skipVerify: ""
  # Restart the pod when the secret changes (needs vault-secrets-reloader).
  reloadOnSecretChange: true
  # Any other vault.security.banzaicloud.io/* annotations.
  annotations: {}

# 2) An existing Secret with these three keys (used when vault.enabled=false).
existingSecret: ""

# --- data (the id cursor and the moderation queue) ---
persistence:
  enabled: true
  # Empty means the default StorageClass.
  storageClass: ""
  accessModes:
    - ReadWriteOnce
  size: 64Mi
  # Use an existing PVC instead of creating one.
  existingClaim: ""
  # The PVC survives helm uninstall and deletion of the ArgoCD application.
  keepOnUninstall: true

resources:
  requests:
    cpu: 10m
    memory: 48Mi
    ephemeral-storage: 16Mi
  limits:
    memory: 128Mi
    # the root is read-only and /tmp lives in memory; the limit guards against runaway logs
    ephemeral-storage: 64Mi

nodeSelector: {}
tolerations: []
affinity: {}
