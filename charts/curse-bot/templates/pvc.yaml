{{- if and .Values.persistence.enabled (not .Values.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "curse-bot.fullname" . }}
  labels:
    {{- include "curse-bot.labels" . | nindent 4 }}
  {{- if .Values.persistence.keepOnUninstall }}
  annotations:
    # Keep the volume with the cursor through helm uninstall and ArgoCD prune/deletion:
    # without it the bot starts over from the current highest id and misses the
    # addons that were waiting for moderation.
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false
  {{- end }}
spec:
  accessModes:
    {{- toYaml .Values.persistence.accessModes | nindent 4 }}
  {{- with .Values.persistence.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.persistence.size }}
{{- end }}
