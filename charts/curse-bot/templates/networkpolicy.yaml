{{- if .Values.networkPolicy.enabled }}
# All ingress is denied: the bot listens on no port. Egress is limited to DNS
# and the listed ports (TCP 443 by default: CurseForge, Telegram, Vault).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "curse-bot.fullname" . }}
  labels:
    {{- include "curse-bot.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "curse-bot.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress: []
  egress:
    - to:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.dns.namespaceSelector | nindent 12 }}
          podSelector:
            {{- toYaml .Values.networkPolicy.dns.podSelector | nindent 12 }}
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    {{- with .Values.networkPolicy.egressPorts }}
    - ports:
        {{- toYaml . | nindent 8 }}
    {{- end }}
    {{- with .Values.networkPolicy.extraEgress }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end }}
