{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "curse-bot.serviceAccountName" . }}
  labels:
    {{- include "curse-bot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# Токен монтируется только в под (см. deployment), и только когда нужен Vault.
automountServiceAccountToken: false
{{- end }}
