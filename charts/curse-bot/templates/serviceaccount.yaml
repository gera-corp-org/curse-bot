{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "curse-bot.serviceAccountName" . }}
  labels:
    {{- include "curse-bot.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
# The token is mounted only into the pod (see deployment), and only when Vault is used.
automountServiceAccountToken: false
{{- end }}
