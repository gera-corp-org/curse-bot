{{- if and (not .Values.vault.enabled) (not .Values.existingSecret) }}
{{- fail "a secrets source is required: vault.enabled=true or existingSecret" }}
{{- end }}
{{- if or (eq (int (.Values.podSecurityContext.runAsUser | default 0)) 0) (eq (int (.Values.podSecurityContext.runAsGroup | default 0)) 0) (not .Values.podSecurityContext.runAsNonRoot) (not .Values.securityContext.runAsNonRoot) }}
{{- fail "the bot does not run as root: podSecurityContext.runAsUser/runAsGroup must be non-zero and runAsNonRoot true" }}
{{- end }}
{{- if not .Values.securityContext.readOnlyRootFilesystem }}
{{- fail "securityContext.readOnlyRootFilesystem must be true" }}
{{- end }}
{{- $heartbeatAge := .Values.liveness.maxAgeSeconds | default (add (mul 2 (int .Values.config.pollInterval)) 300) }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "curse-bot.fullname" . }}
  labels:
    {{- include "curse-bot.labels" . | nindent 4 }}
spec:
  # Strictly one instance: the old pod stops before the new one starts,
  # otherwise addons would be posted twice during a rollout.
  replicas: 1
  revisionHistoryLimit: 3
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "curse-bot.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      {{- $annotations := include "curse-bot.vaultAnnotations" . | fromYaml | default dict }}
      {{- $annotations = merge $annotations (.Values.podAnnotations | default dict) }}
      {{- with $annotations }}
      annotations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      labels:
        {{- include "curse-bot.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "curse-bot.serviceAccountName" . }}
      # The ServiceAccount token is only needed by vault-env to log in to Vault (kubernetes auth method).
      automountServiceAccountToken: {{ .Values.vault.enabled }}
      enableServiceLinks: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: bot
          image: {{ include "curse-bot.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          # The command is explicit: vault-secrets-webhook wraps it in vault-env.
          command: ["python3", "-m", "bot"]
          env:
            - name: DB_PATH
              value: /data/bot.db
            {{- if .Values.liveness.enabled }}
            - name: HEARTBEAT_FILE
              value: /tmp/heartbeat
            {{- end }}
            - name: FLAVORS
              value: {{ .Values.config.flavors | quote }}
            - name: POLL_INTERVAL
              value: {{ .Values.config.pollInterval | quote }}
            {{- with .Values.config.adminIds }}
            {{- /* Helm keeps numbers from values as float64: without %d a large id becomes 2.82307402e+08 */}}
            {{- $ids := list }}
            {{- range . }}
            {{- $ids = append $ids (printf "%d" (int64 .)) }}
            {{- end }}
            - name: TELEGRAM_ADMIN_IDS
              value: {{ join "," $ids | quote }}
            {{- end }}
            {{- if .Values.vault.enabled }}
            {{- range $name, $key := .Values.vault.env }}
            - name: {{ $name }}
              value: {{ printf "vault:%s#%s" $.Values.vault.secretPath $key | quote }}
            {{- end }}
            {{- end }}
            {{- with .Values.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          {{- if and (not .Values.vault.enabled) .Values.existingSecret }}
          envFrom:
            - secretRef:
                name: {{ .Values.existingSecret }}
          {{- end }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          {{- if .Values.liveness.enabled }}
          # The image has no shell, so the probe is python3 itself: the age of the heartbeat file.
          # The first cycle (baseline) checks in long before maxAge.
          livenessProbe:
            exec:
              command:
                - python3
                - -c
                - import os, sys, time; sys.exit(time.time() - os.stat("/tmp/heartbeat").st_mtime > {{ $heartbeatAge }})
            initialDelaySeconds: 60
            periodSeconds: {{ .Values.liveness.periodSeconds }}
            timeoutSeconds: 10
            failureThreshold: {{ .Values.liveness.failureThreshold }}
          {{- end }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "curse-bot.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: tmp
          emptyDir:
            medium: Memory
            sizeLimit: 16Mi
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
