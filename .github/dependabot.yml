# Base images in the Dockerfile are pinned by digest and actions by SHA: without Dependabot
# they would stay old forever. Python dependencies are updated by hand (uv lock), because
# requirements.txt has to be regenerated together with uv.lock — CI checks that.
version: 2
updates:
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: "deps(docker)"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "deps(actions)"
