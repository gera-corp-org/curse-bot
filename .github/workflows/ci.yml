name: CI

on:
  push:
    branches: [master]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

# Least privilege by default; jobs widen it only where they need to.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Python comes from .python-version (3.13, same as the distroless image).
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
      - run: uv sync --locked
      - run: uv run pytest -q
      # The image installs dependencies from requirements.txt; it must match uv.lock.
      - name: requirements.txt matches uv.lock
        run: |
          uv export --no-dev --no-emit-project --no-header --format requirements-txt -o /tmp/requirements.txt
          diff -u requirements.txt /tmp/requirements.txt

  lint:
    name: Dockerfile and Helm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hadolint/hadolint-action@06be81baf89a55ffd0e24b8f04a4185738dd3387 # v3.5.0
        with:
          dockerfile: Dockerfile
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: helm lint and render every branch
        run: |
          helm lint charts/curse-bot --strict
          helm template t charts/curse-bot > /dev/null
          helm template t charts/curse-bot --set vault.enabled=false --set existingSecret=s > /dev/null
          helm template t charts/curse-bot --set persistence.enabled=false > /dev/null
          helm template t charts/curse-bot --set liveness.enabled=false --set networkPolicy.enabled=false > /dev/null
          # ids in values are numbers; Helm keeps them as float64, and without an explicit %d
          # a large id turns into 2.82307402e+08 (that is what broke 0.3.0)
          printf 'config:\n  adminIds:\n    - 282307402\n    - 5\n' > /tmp/ids.yaml
          helm template t charts/curse-bot -f /tmp/ids.yaml | grep -q 'value: "282307402,5"'
          helm template t charts/curse-bot --set "config.adminIds={1,2}" | grep -q 'value: "1,2"'
          # the chart must refuse to render unsafe configurations
          for args in "--set vault.enabled=false" \
                      "--set podSecurityContext.runAsUser=0" \
                      "--set podSecurityContext.runAsNonRoot=false" \
                      "--set securityContext.readOnlyRootFilesystem=false"; do
            # shellcheck disable=SC2086
            if helm template t charts/curse-bot $args > /dev/null 2>&1; then
              echo "::error::the chart rendered with $args"
              exit 1
            fi
          done

  image:
    name: Image
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
    env:
      PUSH: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUSH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=ref,event=pr
            type=raw,value=latest,enable={{is_default_branch}}

      # The final stage runs no RUN, so arm64 builds without QEMU emulation.
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ env.PUSH == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          build-args: VERSION=${{ steps.meta.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          # An SBOM and detailed build provenance are attached to the image in the registry.
          provenance: mode=max
          sbom: true

      # Sigstore-signed attestation; verify with
      #   gh attestation verify oci://ghcr.io/gera-corp-org/curse-bot:<version> -o gera-corp-org
      - name: Attest image provenance
        if: env.PUSH == 'true'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true

      - name: Trivy report for GitHub Security
        if: env.PUSH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        if: env.PUSH == 'true'
        with:
          sarif_file: trivy.sarif
          category: trivy-image

      # The chart is released only after this step, so an image with a critical
      # vulnerability never reaches ArgoCD.
      - name: Trivy fails the build on critical vulnerabilities
        if: env.PUSH == 'true'
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"
          skip-setup-trivy: true

  chart:
    name: Chart
    needs: image
    # The chart is published for releases only, and only after the image of that version
    # is built: ArgoCD never sees a version that has no image yet.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
      - name: Publish the chart to GHCR
        env:
          TAG: ${{ github.ref_name }}
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CHARTS: oci://ghcr.io/${{ github.repository_owner }}/charts
        run: |
          VERSION="${TAG#v}"
          helm package charts/curse-bot --version "$VERSION" --app-version "$VERSION" -d dist
          helm registry login ghcr.io -u "$REGISTRY_USER" --password-stdin <<< "$REGISTRY_TOKEN"
          helm push "dist/curse-bot-${VERSION}.tgz" "$CHARTS"

  release:
    name: GitHub release
    needs: chart
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --generate-notes --verify-tag
