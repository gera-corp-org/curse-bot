services:
  bot:
    build: .
    init: true  # PID 1 forwards SIGTERM, so docker stop does not wait 10 s for SIGKILL
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
      HEARTBEAT_FILE: /tmp/heartbeat
    # the same restrictions as the pod in the cluster
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    volumes:
      # a named volume: Docker creates it owned by the image's user (65532),
      # which the process runs as
      - botdata:/data
    healthcheck:
      # the image has no shell, so the check is python: heartbeat no older than 2 × POLL_INTERVAL + 300
      test: ["CMD", "python3", "-c", "import os, sys, time; sys.exit(time.time() - os.stat('/tmp/heartbeat').st_mtime > 2 * int(os.environ.get('POLL_INTERVAL') or 600) + 300)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  botdata:
