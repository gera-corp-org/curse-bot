services:
  bot:
    build: .
    init: true  # PID 1 пробрасывает SIGTERM, docker stop не ждёт 10 с до SIGKILL
    env_file: .env
    environment:
      DB_PATH: /data/bot.db
      HEARTBEAT_FILE: /tmp/heartbeat
    # те же ограничения, что у пода в кластере
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    pids_limit: 64
    volumes:
      # именованный том: Docker создаёт его с владельцем из образа (65532),
      # под которым работает процесс
      - botdata:/data
    healthcheck:
      # в образе нет shell — проверка на python: heartbeat не старше 2 × POLL_INTERVAL + 300
      test: ["CMD", "python3", "-c", "import os, sys, time; sys.exit(time.time() - os.stat('/tmp/heartbeat').st_mtime > 2 * int(os.environ.get('POLL_INTERVAL') or 600) + 300)"]
      interval: 60s
      timeout: 10s
      start_period: 60s
      retries: 3
    restart: unless-stopped

volumes:
  botdata:
